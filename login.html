<!DOCTYPE html>

<head>
  <link rel="stylesheet" href="style.css" />
  <title>login - Streamly</title>
  <link rel="icon" type="image/x-icon" href="assets/photos/favicon.ico" />
</head>

<body class="main-pages login-page">
  <header></header>
  <main>
    <section class="login-section">
      <h1>Login</h1>
      <form id="loginForm" action="main.html" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <button type="submit" class="a-button">Login</button>
      </form>
    </section>
  </main>
</body>
